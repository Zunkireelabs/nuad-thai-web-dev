services:
  naud-thai-web-prod:
    build: .
    container_name: naud-thai-web-prod
    restart: unless-stopped
    networks:
      - hosting
    labels:
      - "traefik.enable=true"
      # Main router: apex + preview hostnames serve the static site
      - "traefik.http.routers.naud-thai-web-prod.rule=Host(`nuadthainepal.com`) || Host(`naud-web.zunkireelabs.com`)"
      - "traefik.http.routers.naud-thai-web-prod.entrypoints=websecure"
      - "traefik.http.routers.naud-thai-web-prod.tls.certresolver=letsencrypt"
      # www → apex 301 redirect router (canonicalize to non-www)
      - "traefik.http.routers.naud-www-redirect.rule=Host(`www.nuadthainepal.com`)"
      - "traefik.http.routers.naud-www-redirect.entrypoints=websecure"
      - "traefik.http.routers.naud-www-redirect.tls.certresolver=letsencrypt"
      - "traefik.http.routers.naud-www-redirect.middlewares=naud-www-to-apex"
      - "traefik.http.routers.naud-www-redirect.service=naud-thai-web-prod"
      # Redirect middleware: https://www.nuadthainepal.com/* → https://nuadthainepal.com/*
      - "traefik.http.middlewares.naud-www-to-apex.redirectregex.regex=^https?://www\\.nuadthainepal\\.com/(.*)"
      - "traefik.http.middlewares.naud-www-to-apex.redirectregex.replacement=https://nuadthainepal.com/$${1}"
      - "traefik.http.middlewares.naud-www-to-apex.redirectregex.permanent=true"
      # Service
      - "traefik.http.services.naud-thai-web-prod.loadbalancer.server.port=80"

networks:
  hosting:
    external: true
