services:
  naud-thai-web-prod:
    container_name: naud-thai-web-prod
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - hosting
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      - "traefik.http.routers.naud-thai-web-prod.rule=Host(`nuadthainepal.com`)"
      - "traefik.http.routers.naud-thai-web-prod.entrypoints=websecure"
      - "traefik.http.routers.naud-thai-web-prod.tls=true"
      - "traefik.http.routers.naud-thai-web-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.naud-thai-web-prod-http.rule=Host(`nuadthainepal.com`)"
      - "traefik.http.routers.naud-thai-web-prod-http.entrypoints=web"
      - "traefik.http.routers.naud-thai-web-prod-http.middlewares=naud-thai-web-prod-redirect"
      - "traefik.http.middlewares.naud-thai-web-prod-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.naud-thai-web-prod.loadbalancer.server.port=80"

networks:
  hosting:
    external: true
